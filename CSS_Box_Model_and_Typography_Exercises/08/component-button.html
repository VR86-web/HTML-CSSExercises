<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/component-button.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous">
    <title>Component Button</title>
</head>
<body>

    <h4>Link as a button</h4>
    <div class="button-link">
        <a href="#" class="btn-grey">Click Me!</a>
        <a href="#" class="btn-orange">Click Me!</a>
        <a href="#" class="btn-yellow">Click Me!</a>
        <a href="#">Click Me!</a>
        <a href="#" class="btn-dark-grey">✎ Edit</a>
    </div>

    <h4>Button element with class button</h4>
    <div class="button">
        <button class="btn-grey">Click Me!</button>
        <button class="btn-orange">Click Me!</button>
        <button class="btn-yellow">Click Me!</button>
        <button class="btn-white">Click Me!</button>
        <button class="btn-dark-grey">✎ Edit</button>
    </div>

</body>
</html>
