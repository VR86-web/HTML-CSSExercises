<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/calendar.css">
    <title>Calendar</title>
</head>
<body>

    <div class="main-div">

        <div class="container">

            <main class="main">

                <div class="content">

                    <header>
                        <span>Workweek</span>
                    </header>

                    <footer class="footer">
                        <span>1 Monday</span>
                        <span>2 Thuesday</span>
                        <span>3 Wednesday</span>
                        <span>4 Thursday</span>
                        <span>5 Friday</span>
                    </footer>

                </div>

                <div class="content">

                    <header>
                        <span>Weekend</span>
                    </header>

                    <footer class="footer">
                        <span>6 Saturday</span>
                        <span>7 Sunday</span>
                    </footer>
                </div>

            </main>

            <aside class="aside">
                <div>
                    <h4>REMINDERS</h4>
                </div>

                <div>
                    <h4>SPECIAL DATES</h4>
                </div>
                    
                    
            </aside>

        </div>

    </div>

</body>
</html>
